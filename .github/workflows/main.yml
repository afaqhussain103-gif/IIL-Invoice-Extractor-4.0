name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build
      run: |
        pyinstaller --onefile --windowed --name "IIL_Invoice_Extractor" invoice_extractor.py
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: IIL-Invoice-Extractor
        path: dist/IIL_Invoice_Extractor.exe
